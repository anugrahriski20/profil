<head>
    <title>Halaman [Nama Page] Anda</title>
    
    <link rel="stylesheet" href="style.css">
</head>

<main>
    <section id="contact" class="container">
        <h2>Hubungi Saya</h2>
        <p>Tertarik bekerja sama? Silakan kirimkan pesan melalui formulir di bawah ini atau melalui email/media sosial saya.</p>

        <div class="contact-form-container" style="max-width: 600px; margin: 30px auto;">
            <form action="URL_PROSES_FORMULIR" method="POST" style="display: flex; flex-direction: column; gap: 15px;">
                <label for="name">Nama:</label>
                <input type="text" id="name" name="name" required style="padding: 10px; border: 1px solid #ddd; border-radius: 4px;">

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required style="padding: 10px; border: 1px solid #ddd; border-radius: 4px;">

                <label for="message">Pesan:</label>
                <textarea id="message" name="message" rows="6" required style="padding: 10px; border: 1px solid #ddd; border-radius: 4px;"></textarea>

                <button type="submit" style="padding: 10px 20px; background: #2c3e50; color: white; border: none; cursor: pointer; border-radius: 4px;">Kirim Pesan</button>
            </form>
        </div>

        <h3 style="margin-top: 40px;">Info Kontak Lainnya</h3>
        <p>Email: <a href="mailto:emailanda@example.com">emailanda@example.com</a></p>
        <p>LinkedIn: <a href="URL_LINKEDIN" target="_blank">Nama LinkedIn Anda</a></p>
    </section>
</main>
